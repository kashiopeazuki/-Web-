<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My YouTube Channel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f9f9f9;
        }
        header {
            background-color: #ff0000;
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
        }
        header img {
            border-radius: 50%;
            width: 60px;
            margin-right: 20px;
        }
        header h1 {
            font-size: 24px;
        }
        nav {
            background-color: #333;
            color: white;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }
        .container {
            display: flex;
            padding: 20px;
        }
        .videos {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .video {
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            transition: transform 0.2s;
        }
        .video:hover {
            transform: scale(1.03);
        }
        .thumbnail {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }
        .thumbnail img {
            width: 100%;
            display: block;
        }
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.8);
            clip-path: polygon(30% 20%, 30% 80%, 80% 50%);
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .play-icon:hover {
            background-color: rgba(255, 255, 255, 1);
        }
        .video h3 {
            margin: 10px 0 5px 0;
            font-size: 18px;
        }
        .video p {
            margin: 0;
            color: #555;
            font-size: 14px;
        }
        aside {
            flex: 1;
            margin-left: 20px;
        }
        aside h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        aside ul {
            list-style: none;
            padding: 0;
        }
        aside li {
            background-color: white;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #ddd;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <img src="https://via.placeholder.com/60" alt="チャンネルアイコン">
        <h1>My Awesome Channel</h1>
    </header>
    <nav>
        <a href="#">ホーム</a>
        <a href="#">動画</a>
        <a href="#">再生リスト</a>
        <a href="#">コミュニティ</a>
        <a href="#">チャンネルについて</a>
    </nav>
    <div class="container">
        <div class="videos">
            <div class="video">
                <div class="thumbnail">
                    <img src="https://via.placeholder.com/400x225" alt="動画サムネイル">
                    <div class="play-icon"></div>
                </div>
                <h3>動画タイトル1</h3>
                <p>再生回数 1,234 回 • 1日前</p>
            </div>
            <div class="video">
                <div class="thumbnail">
                    <img src="https://via.placeholder.com/400x225" alt="動画サムネイル">
                    <div class="play-icon"></div>
                </div>
                <h3>動画タイトル2</h3>
                <p>再生回数 2,345 回 • 3日前</p>
            </div>
            <div class="video">
                <div class="thumbnail">
                    <img src="https://via.placeholder.com/400x225" alt="動画サムネイル">
                    <div class="play-icon"></div>
                </div>
                <h3>動画タイトル3</h3>
                <p>再生回数 3,456 回 • 1週間前</p>
            </div>
        </div>
        <aside>
            <h2>人気動画</h2>
            <ul>
                <li>人気動画1</li>
                <li>人気動画2</li>
                <li>人気動画3</li>
            </ul>
        </aside>
    </div>
    <footer>
        &copy; 2026 My Awesome Channel
    </footer>
</body>
</html>
